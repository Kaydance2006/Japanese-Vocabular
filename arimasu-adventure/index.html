<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Arimasu Adventure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one screen at a time inside a sticky toolbar. Chunky "sticker" cards with thick ink outlines and hard offset shadows; bright daytime palette; Japanese text always the largest thing on screen. */
:root{
  --bg:#fff4dc; --ink:#2a2150; --card:#ffffff; --soft:#f6ecd2; --muted:#675f8c;
  --sun:#ffbf2f; --coral:#ff6a5c; --mint:#27c19b; --sky:#3fa7ff; --grape:#8b5cf6; --pink:#ff8fc7;
  --sun-l:#fff0c2; --coral-l:#ffdad6; --mint-l:#d3f6ea; --sky-l:#d8ecff; --grape-l:#e8defd;
  --t-place:#1b76d1; --t-item:#0b8a6a; --t-verb:#b86a00;
  --font-display:'Fredoka','Zen Maru Gothic',system-ui,sans-serif;
  --font-jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;
  --pop:0 5px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  background-image:radial-gradient(circle at 12% 8%,#ffffff 0 60px,transparent 61px),radial-gradient(circle at 18% 6%,#ffffff 0 40px,transparent 41px),radial-gradient(circle at 88% 14%,#ffffff 0 50px,transparent 51px),radial-gradient(circle at 94% 12%,#ffffff 0 34px,transparent 35px);
  background-repeat:no-repeat;
  font-family:var(--font-jp); font-size:17px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--grape);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* toolbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:3px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;background:none;border:0;padding:0}
.logo .mk{font-size:1.7rem}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pill{border:3px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;box-shadow:0 3px 0 var(--ink);min-height:38px}
.pill[aria-pressed="true"]{background:var(--sun)}
.pill:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
main{padding-block:20px 60px}
/* generic */
.btn{border:3px solid var(--ink);background:var(--sun);border-radius:18px;padding:12px 22px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;box-shadow:var(--pop);min-height:52px;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.big{font-size:1.5rem;padding:16px 30px;background:var(--coral);color:#fff;text-shadow:0 2px 0 rgba(42,33,80,.5)}
.btn.alt{background:var(--card)}
.btn.mint{background:var(--mint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--pop);padding:16px}
.sec{margin-top:28px}
.sec>h2{font-size:1.5rem;margin-bottom:12px}
.sub{color:var(--muted);font-size:.95rem}
.ro{font-family:var(--font-display);font-weight:500;color:var(--muted);font-size:.72em;letter-spacing:.02em}
body.noro .ro{display:none}
.knj{display:none} body.kj .knj{display:inline} body.kj .kna{display:none}
rt{font-size:.5em;font-weight:500}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--sky-l);border:3px solid var(--ink);border-radius:26px;box-shadow:var(--pop);padding:18px}
.hero .cat{font-size:clamp(64px,16vw,110px);line-height:1;animation:bob 3s ease-in-out infinite}
.hero h1{font-size:clamp(1.7rem,6vw,2.6rem)}
.hero p{margin:6px 0 14px}
.lvl{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--font-display);font-weight:600;flex-wrap:wrap}
.bar{flex:1;min-width:120px;height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width .4s}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.world{border:3px solid var(--ink);border-radius:20px;background:var(--card);padding:12px 8px;text-align:center;box-shadow:var(--pop);display:flex;flex-direction:column;gap:2px;align-items:center}
.world .e{font-size:2.3rem;line-height:1.1}
.world b{font-family:var(--font-display)}
.world[aria-pressed="true"]{background:var(--mint-l);transform:translateY(3px);box-shadow:0 2px 0 var(--ink);outline:4px solid var(--mint);outline-offset:2px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gcard{border:3px solid var(--ink);border-radius:22px;box-shadow:var(--pop);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--gc,#fff);min-width:0}
.gcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.gcard .ge{font-size:2.2rem;line-height:1}
.gcard b{font-family:var(--font-display);font-size:1.15rem}
.gcard .jpn{font-size:.95rem;font-weight:700}
.gcard small{color:var(--ink);opacity:.8}
.gcard .stars{font-size:1rem;letter-spacing:2px;margin-top:auto;padding-top:6px}
.gcard[disabled]{opacity:.5}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 200px}
/* tokens (sentences) */
.sent{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end;justify-content:center}
.tok{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.tok .tk{font-weight:900;font-size:clamp(1.5rem,6.2vw,2.2rem)}
.tok .ro{font-size:.72rem}
.tok.place .tk{color:var(--t-place)} .tok.item .tk{color:var(--t-item)} .tok.verb .tk{color:var(--t-verb)}
.tok.pt .tk{border-radius:12px;padding:0 8px;color:#fff;text-shadow:0 1px 0 rgba(42,33,80,.4)}
.p-ni .tk{background:#ee6a1a} .p-ga .tk{background:#2d86e8} .p-de .tk{background:#16a37f} .p-o .tk{background:#e5434f} .p-ka .tk{background:#8b5cf6}
.tok.blank .tk{border:3px dashed var(--ink);border-radius:14px;min-width:2.1em;text-align:center;background:var(--sun-l);animation:pulse 1.2s infinite}
.en{color:var(--muted);text-align:center;font-weight:700;font-family:var(--font-display)}
/* run screen */
.runbar{display:flex;align-items:center;gap:12px}
.runbar .x{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-weight:900;box-shadow:0 3px 0 var(--ink);flex:none}
.prog{flex:1;height:20px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sky);transition:width .3s}
.streak{font-family:var(--font-display);font-weight:700;min-width:64px;text-align:right}
.mrow{display:flex;gap:12px;align-items:center;margin:16px 0}
.mascot{font-size:3.4rem;line-height:1;flex:none;animation:bob 2.6s ease-in-out infinite}
.mascot.hop{animation:hop .5s}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:700;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;width:18px;height:18px;background:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.stage{display:flex;flex-direction:column;gap:18px;align-items:center}
.qcard{width:100%;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bigemoji{font-size:clamp(84px,24vw,150px);line-height:1.05}
.bigword{font-size:clamp(2.4rem,12vw,4.2rem);font-weight:900;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.opt{border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:var(--pop);min-height:92px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:clamp(1.4rem,6vw,2rem);min-width:0;overflow-wrap:anywhere}
.opt.pic{font-size:clamp(3rem,14vw,4.6rem);line-height:1.1;min-height:110px}
.opt:active:not([disabled]){transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.opt.correct{background:var(--mint);animation:hop .5s}
.opt.wrong{background:var(--coral-l);animation:shake .4s}
.opt[disabled]{cursor:default}
.opts.two .opt{min-height:120px}
.opt.aru{background:var(--coral-l)} .opt.iru{background:var(--sun-l)}
.opt small{font-weight:700;font-size:.9rem;color:var(--muted)}
.fb{width:100%;border:3px solid var(--ink);border-radius:20px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:rise .25s}
.fb.ok{background:var(--mint-l)} .fb.bad{background:var(--coral-l)}
.fb h3{font-size:1.4rem}
/* spelling and sentence building */
.slots,.answer{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.slot{width:clamp(44px,13vw,64px);height:clamp(54px,15vw,74px);border:3px dashed var(--ink);border-radius:14px;display:grid;place-items:center;font-size:clamp(1.6rem,7vw,2.4rem);font-weight:900;background:var(--sun-l)}
.slot.on{border-style:solid;background:var(--mint-l);animation:hop .3s}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.tile{border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:6px 14px;min-width:54px;min-height:58px;font-weight:900;font-size:clamp(1.3rem,5.4vw,1.9rem);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tile:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.tile[disabled]{visibility:hidden}
.tile.shake{animation:shake .4s;background:var(--coral-l)}
.tile.p-ni{background:#ffe3d0} .tile.p-ga{background:#d8e9ff} .tile.p-de{background:#d2f3e8} .tile.p-o{background:#ffd9dc} .tile.p-ka{background:var(--grape-l)}
.answer{min-height:84px;border:3px dashed var(--ink);border-radius:18px;padding:10px;background:var(--sun-l);align-items:center;align-content:center}
.answer.ok{background:var(--mint-l);border-style:solid} .answer.bad{background:var(--coral-l);border-style:solid}
/* scene */
.scene{position:relative;width:100%;border:3px solid var(--ink);border-radius:24px;box-shadow:var(--pop);padding:36px 14px 22px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;min-height:240px;background:var(--sc,#d8f3dc);overflow:hidden}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(39,193,155,.45);border-top:3px solid var(--ink)}
.scene .tag{position:absolute;left:10px;top:8px;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:900;font-size:.95rem;z-index:1}
.si{font-size:clamp(46px,13vw,76px);line-height:1;background:none;border:0;padding:2px;animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s);transform:rotate(var(--r,0deg));z-index:1}
button.si:active{transform:scale(.85)}
.si.shake{animation:shake .4s}
.si.found{animation:hop .6s;filter:drop-shadow(0 0 12px var(--sun))}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.mc{aspect-ratio:3/4;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);background:var(--grape);color:#fff;font-size:2rem;font-weight:900;display:grid;place-items:center;padding:2px;min-width:0;overflow:hidden;transition:transform .25s}
.mc .face{display:none;color:var(--ink);font-size:clamp(1rem,4.6vw,1.7rem);line-height:1.1;text-align:center;overflow-wrap:anywhere}
.mc .face.e{font-size:clamp(1.9rem,9vw,3rem)}
.mc.up{background:#fff;transform:rotateY(360deg)} .mc.up .face{display:block} .mc.up .back{display:none}
.mc.done{background:var(--mint-l);opacity:.85}
/* lesson */
.lesson h2{font-size:1.8rem;margin-bottom:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.panel{border:3px solid var(--ink);border-radius:20px;padding:12px;text-align:center}
.panel.aru{background:var(--coral-l)} .panel.iru{background:var(--sun-l)}
.panel .big{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:900}
.emjrow{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.emjrow button{font-size:2.3rem;background:none;border:0;padding:4px;line-height:1}
.emjrow button:active{transform:scale(.8)}
.chunks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.chunk{border:3px solid var(--ink);border-radius:16px;padding:8px 12px;text-align:center;min-width:100px;flex:1 1 100px}
.chunk b{display:block;font-size:1.5rem;font-weight:900}
.chunk span{font-size:.85rem;font-weight:700}
.chunk.c1{background:var(--sky-l)} .chunk.c2{background:#ffe3d0} .chunk.c3{background:var(--mint-l)} .chunk.c4{background:#d8e9ff} .chunk.c5{background:var(--sun-l)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dots i.on{background:var(--grape)}
.excard{margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.note{background:var(--sun-l);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin-top:12px;font-weight:500}
.ql{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.say{border:3px solid var(--ink);background:#fff;border-radius:50%;width:48px;height:48px;font-size:1.3rem;box-shadow:0 3px 0 var(--ink);flex:none}
.say:active{transform:translateY(3px);box-shadow:none}
/* word garden & stickers */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.wc{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;line-height:1.2}
.wc .e{font-size:2.4rem;line-height:1.15}
.wc b{font-size:1.1rem;font-weight:900;overflow-wrap:anywhere}
.wc.locked{background:var(--soft)} .wc.locked .e{filter:brightness(0);opacity:.22}
.wc .pips{font-size:.75rem;letter-spacing:2px;color:var(--muted)}
.wc .en2{font-size:.78rem;color:var(--muted);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(42,33,80,.55);z-index:40;display:grid;place-items:center;padding:16px;overflow:auto}
.modal .card{max-width:440px;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.trace{width:100%;max-width:360px;height:190px;border:3px dashed var(--ink);border-radius:16px;background:#fff;touch-action:none}
/* results */
.stars3{font-size:3.4rem;letter-spacing:6px}
.stars3 span{display:inline-block;animation:hop .6s both}
.sticker-new{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sticker-new span{font-size:2.4rem;background:var(--sun-l);border:3px solid var(--ink);border-radius:16px;padding:4px 10px}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf{position:absolute;font-size:var(--s,28px);animation:fall var(--t,1.6s) ease-out forwards}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;z-index:70;max-width:90vw;text-align:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
@keyframes hop{0%{transform:scale(1)}40%{transform:scale(1.18) translateY(-8px)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{50%{background:#fff}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,300px)) rotate(var(--rot,360deg))}}
@media (max-width:520px){
  .hero{grid-template-columns:1fr;text-align:center}
  .tg{margin-left:auto;flex-wrap:nowrap}
  .pill .lbl{display:none}
  .pill{padding:4px 10px}
  .logo{font-size:1rem}
  .games{grid-template-columns:1fr 1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="top" class="top"><div class="wrap">
  <button class="logo" id="logo" aria-label="Home"><span class="mk">🐱</span><span>Arimasu Adventure</span></button>

</div></div>
<main class="wrap" id="app"></main>
<div id="modal" class="modal" hidden></div>

<div id="toast" hidden></div>

<script>

def('thing',[

/* ---------- sentence makers ---------- */
function existS(place,item,form){
  const live=item.kind==='living';
  const v=form==='neg'?(live?VERBT('いません','imasen'):VERBT('ありません','arimasen')):(live?VERBT('います','imasu'):VERBT('あります','arimasu'));
  const toks=[T(place,'place'),P('に'),T(item,'item'),P('が'),v];
  let end='。',en;
  if(form==='q'){toks.push(P('か'));end='？';en=`Is there ${art(item)}${item.en} ${penAt(place)}?`;}
  else if(form==='neg')en=`There is no ${item.en} ${penAt(place)}.`;
  else en=`There is ${art(item)}${item.en} ${penAt(place)}.`;
  return {type:'exist',form,toks,end,en,ids:[place.id,item.id],place,item,alt:true};
}
function actS(vp,obj,place){
  const toks=[T(place,'place'),P('で')];
  let en;
  if(obj){toks.push(T(obj,'item'),P('を'));en=`I ${vp.en} ${art(obj)}${obj.en} ${penAt(place)}.`;}
  else en=`I ${vp.en} ${penAt(place)}.`;
  toks.push(VERBT(vp.id,vp.ro));
  return {type:'act',toks,end:'。',en,ids:[place.id,vp.id].concat(obj?[obj.id]:[]),place,obj,vp,alt:!!obj};
}
function goalS(vp,place){
  const toks=[T(place,'place'),P('に'),VERBT(vp.id,vp.ro)];
  const en=place.pen==='home'?`I ${vp.en==='return'?'return':vp.en} home.`:`I ${vp.en} to ${place.pen}.`;
  return {type:'goal',toks,end:'。',en,ids:[place.id,vp.id],place,vp,alt:false};
}

/* ---------- weighted picking and uniqueness ---------- */
const prog=id=>S.prog[id]||(S.prog[id]={c:0,w:0});
function wpick(list,exclude){
  const ex=exclude||[];
  let cand=list.filter(w=>!ex.includes(w.id));if(!cand.length)cand=list;
  const ws=cand.map(w=>{const p=S.prog[w.id]||{c:0,w:0};let x=1/(1+0.6*p.c);if(p.w>p.c)x*=1.6;if(S.recent.includes(w.id))x*=0.12;return x;});
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){r-=ws[i];if(r<=0)return cand[i];}
  return cand[cand.length-1];
}
function used(ids){ids.forEach(i=>{S.recent=S.recent.filter(x=>x!==i);S.recent.push(i);});if(S.recent.length>45)S.recent.splice(0,S.recent.length-45);}
let session=null;
function genUnique(fn){
  let q;
  for(let i=0;i<40;i++){q=fn();if(!q)continue;if(!SIGS.has(q.sig)&&!session.sigs.has(q.sig))break;}
  SIGS.add(q.sig);session.sigs.add(q.sig);S.sigs.push(q.sig);
  if(S.sigs.length>600)S.sigs.splice(0,S.sigs.length-600);
  used(q.ids||[]);
  return q;
}
function distract(t,n){
  const pool=poolWords().filter(w=>w.id!==t.id&&w.e!==t.e);
  const same=pool.filter(w=>w.kind===t.kind);
  const src=same.length>=n+2?same:pool;
  const sc=isKata(t.k);
  const sorted=shuffle(src).sort((a,b)=>(isKata(b.k)===sc)-(isKata(a.k)===sc));
  return shuffle(sorted.slice(0,n*2)).slice(0,n);
}

function vpChoices(withObj,goal){
  const wp=worldPlaces().map(p=>p.id);
  return VP.filter(v=>(goal?v.goal:!v.goal)&&v.places.some(x=>wp.includes(x)));

function pickAction(){
  const wp=worldPlaces().map(p=>p.id),wd=WORLD();
  let list=VP.filter(v=>!v.goal&&v.places.some(x=>wp.includes(x))&&!(wd.only&&v.objs));
  if(!list.length)list=VP.filter(v=>!v.goal);
  const vp=wpick(list.map(v=>v.w));const v=VP.find(x=>x.id===vp.id);
  const pls=v.places.filter(x=>wp.includes(x));const place=BY[pick(pls.length?pls:v.places)];
  const obj=v.objs?BY[pick(v.objs)]:null;
  return actS(v,obj,place);
}
function pickGoal(){
  const wp=worldPlaces().map(p=>p.id);
  let list=VP.filter(v=>v.goal&&v.places.some(x=>wp.includes(x)));if(!list.length)list=VP.filter(v=>v.goal);
  const pw=wpick(list.map(x=>x.w)),v=VP.find(x=>x.id===pw.id);
  const pls=v.places.filter(x=>wp.includes(x));
  return goalS(v,BY[pick(pls.length?pls:v.places)]);
}

function tone(f,t0,dur,type,vol,slide){
  const a=ac();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

const OKMSG=[['すごい！','Sugoi!'],['やった！','Yatta!'],['いいね！','Ii ne!'],['かんぺき！','Kanpeki!'],['さすが！','Sasuga!'],['せいかい！','Seikai!']];
const BADMSG=[['おしい！','Oshii! Almost!'],['だいじょうぶ！','Daijoobu! It is okay!'],['ファイト！','Faito! Keep going!']];
function startRun(types,count,label,mixed){
  const avail=types.filter(gameAvail);
  session={types:avail,count,i:0,ok:0,xp:0,streak:0,max:0,missed:[],sigs:new Set(),unlocked:[],label,mixed:!!mixed,lv0:level(),last:null,bag:[]};
  S.plays++;nextQ();

function chooseType(){
  const s=session;
  if(s.types.length===1)return s.types[0];
  if(!s.bag.length){
    s.bag=shuffle(s.types);
    if(s.bag[s.bag.length-1]===s.last&&s.bag.length>1)s.bag.reverse();
  }
  let t=s.bag.pop();
  if(t===s.last&&s.bag.length){const u=s.bag.pop();s.bag.push(t);t=u;}
  return t;
}
function nextQ(){
  const s=session;
  if(s.i>=s.count)return finishRun();
  const type=chooseType();s.last=type;
  const G=GAMES[type];const q=genUnique(()=>G.gen());

   <div class="mrow"><div class="mascot" id="mas">🐱</div><div class="bubble" id="bub"></div></div>
   <div class="stage" id="stage"></div>`;
  $('#quit').onclick=()=>{save();go('home');};
  const say=t=>{$('#bub').innerHTML=`<span style="color:${G.color==='#fff'?'':'inherit'}">${G.e} <b>${G.name}</b></span> · ${t}`;};
  const stage=$('#stage');let finished=false;
  const done=(ok,ids,explain)=>{
    if(finished)return;finished=true;
    (ids||[]).forEach(id=>{const p=prog(id);const before=p.c;if(ok)p.c++;else p.w++;if(ok&&before<3&&p.c>=3&&BY[id])s.unlocked.push(BY[id]);});
    let gain=0;
    if(ok){s.ok++;s.streak++;s.max=Math.max(s.max,s.streak);gain=10+Math.min(s.streak-1,5)*2;s.xp+=gain;S.xp+=gain;}
    else{s.streak=0;(ids||[]).forEach(id=>{if(BY[id]&&!s.missed.includes(BY[id]))s.missed.push(BY[id]);});}
    save();
    sfx(ok?(s.streak>=3?'combo':'ok'):'bad');
    if(ok)burst(s.streak>=3?26:14,s.streak>=3?CONF:['⭐','✨']);
    const m=pick(ok?OKMSG:BADMSG);
    const mas=$('#mas');mas.textContent=ok?'😸':'🙀';mas.classList.add('hop');
    const fb=el('div','fb '+(ok?'ok':'bad'),`<h3>${m[0]} ${roS(m[1])}${ok?` <span style="font-size:1rem">+${gain} XP</span>`:''}</h3>${explain?`<div>${explain}</div>`:''}`);
    const nb=el('button','btn',s.i+1>=s.count?'Finish 🎉':'Next ▶');
    nb.onclick=()=>{s.i++;nextQ();};fb.appendChild(nb);stage.appendChild(fb);
    nb.scrollIntoView({block:'nearest',behavior:'smooth'});nb.focus({preventScroll:true});
  };
  G.mount(q,stage,done,say);
}
function finishRun(){
  const s=session;const acc=s.ok/s.count;
  const stars=acc>=.9?3:acc>=.6?2:1;
  s.stars=stars;s.lvUp=level()>s.lv0;
  if(s.types.length===1){const k=s.types[0];S.best[k]=Math.max(S.best[k]||0,stars);}
  else S.best.adventure=Math.max(S.best.adventure||0,stars);
  save();sfx(s.lvUp?'level':'win');burst(40,CONF,null,innerHeight/4,800);
  go('results');
}
function renderResults(){
  const s=session;if(!s){go('home');return;}
  const msg=s.stars===3?'Amazing!':s.stars===2?'Great job!':'Good try! Practice makes you stronger!';
  app.innerHTML=`<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:10px">
   <div style="font-size:5rem;line-height:1">${s.stars===3?'🏆':s.stars===2?'🎖️':'🌱'}</div>
   <h1>${msg}</h1>
   <div class="stars3">${[1,2,3].map(i=>`<span style="animation-delay:${i*.18}s;opacity:${i<=s.stars?1:.2}">⭐</span>`).join('')}</div>
   <div><b>${s.ok}</b> of <b>${s.count}</b> correct · best streak <b>🔥${s.max}</b> · <b>+${s.xp} XP</b></div>

   ${s.missed.length?`<div><b>Let's practice these again</b></div><div class="sticker-new">${s.missed.map(w=>`<span style="font-size:1.1rem;background:var(--coral-l)">${w.e ? w.e+' ':''}${jp(w)}</span>`).join('')}</div>`:''}

  $('#again').onclick=()=>startRun(session.types,session.count,session.label,session.mixed);
  $('#home').onclick=()=>go('home');
}

/* ---------- lesson ---------- */

const LESSON=[
 {h:'Two ways to say “there is”',html:()=>{
   const things=shuffle(EXISTERS.filter(w=>w.kind!=='living')).slice(0,4),live=shuffle(EXISTERS.filter(w=>w.kind==='living')).slice(0,4);

 {h:'The subject is the star ⭐',html:()=>`<p>The <b>subject</b> is the thing that exists. The little word <b style="color:#2d86e8">が</b> goes right after it.</p>

   <div data-ex="act" class="card excard">${(()=>{const s=pickAction();return sentHTML(s)+`<div class="en">${s.en}</div>`+speakBtn(sentText(s));})()}</div>

function renderLesson(){
  const L=LESSON[lessonIdx];
  app.innerHTML=`<div class="lesson card"><div class="sub">Lesson ${lessonIdx+1} of ${LESSON.length}</div><h2>${L.h}</h2><div id="lbody">${L.html()}</div>
  <div class="pager"><button class="btn alt" id="pv" ${lessonIdx?'':'disabled'}>◀ Back</button><div class="dots">${LESSON.map((_,i)=>`<i class="${i===lessonIdx?'on':''}"></i>`).join('')}</div><button class="btn" id="nx">${lessonIdx===LESSON.length-1?'Let’s play! ▶':'Next ▶'}</button></div></div>`;
  $('#pv').onclick=()=>{lessonIdx--;sfx('tap');go('lesson');};
  $('#nx').onclick=()=>{sfx('tap');if(lessonIdx===LESSON.length-1){lessonIdx=0;go('home');}else{lessonIdx++;go('lesson');}};
  const lb=$('#lbody');
  lb.onclick=e=>{
    const w=e.target.closest('[data-w]');
    if(w){const x=BY[w.dataset.w],v=x.kind==='living'?['います','imasu']:['あります','arimasu'];ac();sfx('pop');speak(x.k+'が'+v[0]);
      $('#wout').innerHTML=`<div class="sent"><span class="tok item"><span class="tk">${jp(x)}</span>${roS(x.ro)}</span><span class="tok pt p-ga"><span class="tk">が</span>${roS('ga')}</span><span class="tok verb"><span class="tk">${v[0]}。</span>${roS(v[1])}</span></div><div class="en">${x.e} ${x.en}</div>`;return;}
    const n=e.target.closest('[data-new]');
    if(n){sfx('tap');const box=n.parentElement.previousElementSibling.matches('[data-ex]')?n.parentElement.previousElementSibling:lb.querySelector('[data-ex]');

      if(k==='act')box.innerHTML=(()=>{const s=pickAction();return sentHTML(s)+`<div class="en">${s.en}</div>`+speakBtn(sentText(s));})();
      else box.innerHTML=exampleBlock(k);
      const a=$('#aout');if(a)a.innerHTML='<span class="sub">Tap an answer.</span>';return;}
    const a=e.target.closest('[data-ans]');
    if(a){sfx(a.dataset.ans==='y'?'ok':'pop');$('#aout').innerHTML=a.dataset.ans==='y'?`<b>あります／います。</b> ${roS('arimasu / imasu')}<div class="sub">Yes, there is!</div>`:`<b>ありません／いません。</b> ${roS('arimasen / imasen')}<div class="sub">No, there is not.</div>`;}
  };
}

/* ---------- word garden ---------- */
let gardenFilter='all';
function renderGarden(){
  const filters=[['all','All'],['place','Places 🏞️'],['thing','Things 🪑'],['living','Living 🐶'],['verb','Verbs 🏃']];
  const list=WORDS.filter(w=>gardenFilter==='all'||w.kind===gardenFilter);
  app.innerHTML=`<h2 style="margin-bottom:12px">Word Garden 🌱</h2><p class="sub">Tap a word to hear it and practice writing it.</p>
  <div class="chips">${filters.map(f=>`<button class="pill" data-f="${f[0]}" aria-pressed="${gardenFilter===f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="wgrid">${list.map(w=>`<button class="wc" data-id="${w.id}"><span class="e">${w.e}</span><b>${jp(w)}</b>${roS(w.ro)}<span class="en2">${w.en}</span></button>`).join('')}</div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{gardenFilter=b.dataset.f;sfx('tap');renderGarden();});
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sfx('pop');openWord(BY[b.dataset.id]);});
}
function renderStickers(){
  const got=unlockedCount();
  const groups=[['place','Places'],['thing','Things'],['living','Living things'],['verb','Verbs']];
  app.innerHTML=`<h2>Sticker Book ⭐</h2><p class="sub">Answer a word correctly 3 times to win its sticker. You have <b>${got}</b> of <b>${WORDS.length}</b>.</p>
  <div class="bar" style="margin:10px 0 4px"><i style="width:${got/WORDS.length*100}%"></i></div>
  ${groups.map(g=>`<section class="sec"><h2 style="font-size:1.2rem">${g[1]}</h2><div class="wgrid">${WORDS.filter(w=>w.kind===g[0]).map(w=>{const c=Math.min((S.prog[w.id]||{}).c||0,3);return `<button class="wc ${c>=3?'':'locked'}" data-id="${w.id}"><span class="e">${w.e}</span><b>${jp(w)}</b><span class="pips">${'●'.repeat(c)+'○'.repeat(3-c)}</span></button>`;}).join('')}</div></section>`).join('')}`;
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sfx('pop');openWord(BY[b.dataset.id]);});
}
function clearModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}
function openWord(w){
  const m=$('#modal');
  let ex='';
  if(w.kind==='place'||w.kind==='thing'||w.kind==='living'){
    const place=w.kind==='place'?w:BY[Object.keys(AT).find(p=>AT[p].includes(w.id))||''];
    if(place&&w.kind!=='place'||(w.kind==='place'&&AT[w.id])){
      const item=w.kind==='place'?BY[pick(AT[w.id])]:w;const s=existS(place,item,'pos');
      ex=`<div class="card" style="box-shadow:none;width:100%;padding:8px">${sentHTML(s)}<div class="en" style="font-size:.9rem">${s.en}</div></div>`;
    }
  }
  m.innerHTML=`<div class="card"><div class="bigemoji" style="font-size:5rem">${w.e}</div><div class="bigword">${jp(w)}</div>${roS(w.ro)}<div class="en">${w.en}</div>${w.kj?`<div class="sub">Kanji: <b style="font-size:1.3rem">${w.kj}</b></div>`:''}${speakBtn(w.k)}${ex}
   <div class="sub" style="margin-top:6px">✏️ Trace it with your finger or mouse</div><canvas class="trace" id="cv"></canvas>
   <div class="row" style="width:100%"><button class="btn alt" id="clr">Clear</button><button class="btn" id="cls">Close</button></div></div>`;
  m.hidden=false;
  m.onclick=e=>{if(e.target===m)clearModal();};
  $('#cls').onclick=clearModal;
  const cv=$('#cv'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const guide=()=>{c.clearRect(0,0,r.width,r.height);const n=[...w.k].length;const fs=Math.min(120,(r.width-20)/n,r.height-30);c.font=`900 ${fs}px "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(42,33,80,.16)';c.fillText(w.k,r.width/2,r.height/2+4);};
  guide();
  let down=false;
  const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y+.1);c.strokeStyle='#ee4a6b';c.lineWidth=7;c.lineCap='round';c.lineJoin='round';c.stroke();};
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);c.lineTo(x,y);c.stroke();};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  $('#clr').onclick=guide;
}

/* ---------- boot ---------- */
applySettings();
if(S.settings.music){/* music waits for a tap, browsers block autoplay */}
renderHome();
window.AA={GAMES,startRun,go,S,WORDS,BY,VP,session:()=>session,setVoice:v=>{JV=v;},poolWords,sentHTML};
})();
